name: Stage koharu-astro on npm

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to attach after owner approval
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      confirm_stage:
        description: Stage the audited package for an owner 2FA approval
        required: true
        type: boolean
        default: false

concurrency:
  group: stage-koharu-astro
  cancel-in-progress: false

jobs:
  audit:
    name: Audit npm package
    if: inputs.confirm_stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Require owner-completed npm setup
        env:
          TRUSTED_PUBLISHING_CONFIGURED: ${{ vars.NPM_TRUSTED_PUBLISHING_CONFIGURED }}
        run: |
          if [[ "$TRUSTED_PUBLISHING_CONFIGURED" != "true" ]]; then
            echo "Configure npm trusted publishing and the protected npm environment first." >&2
            exit 1
          fi

      - name: Require the protected main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "npm staging must be dispatched from main." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Pin npm with staged publishing support
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Pack and audit publish artifact
        id: artifact
        run: pnpm pack:koharu-astro

      - name: Record package version
        id: package
        run: |
          version="$(node -p "require('./packages/koharu-astro/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test audited package in minimal Astro fixtures
        env:
          KOHARU_ASTRO_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: pnpm test:astro-fixture

      - name: Test audited package in pinned astro-koharu template
        env:
          KOHARU_ASTRO_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: pnpm test:astro-template

      - name: Preserve audited tarball
        uses: actions/upload-artifact@v4
        with:
          name: koharu-astro-npm-package
          path: ${{ steps.artifact.outputs.tarball }}
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  stage:
    name: Stage audited npm package
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm with staged publishing support
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Download audited tarball
        uses: actions/download-artifact@v4
        with:
          name: koharu-astro-npm-package
          path: .artifacts/koharu-astro

      - name: Verify audited tarball
        env:
          EXPECTED_SHA256: ${{ needs.audit.outputs.sha256 }}
          EXPECTED_VERSION: ${{ needs.audit.outputs.version }}
          TARBALL: .artifacts/koharu-astro/package.tgz
        run: |
          actual_sha256="$(sha256sum "$TARBALL")"
          actual_sha256="${actual_sha256%% *}"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Audited tarball checksum mismatch." >&2
            exit 1
          fi
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/koharu-astro-package.json"
          actual_name="$(node -p "require('$RUNNER_TEMP/koharu-astro-package.json').name")"
          actual_version="$(node -p "require('$RUNNER_TEMP/koharu-astro-package.json').version")"
          if [[ "$actual_name" != "@coszone/koharu-astro" || "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Audited tarball package identity mismatch." >&2
            exit 1
          fi

      - name: Refuse bootstrap or an existing version
        env:
          VERSION: ${{ needs.audit.outputs.version }}
        run: |
          if [[ "$VERSION" == "0.0.0" ]]; then
            echo "Merge the Version Packages PR and complete the owner bootstrap before using trusted publishing." >&2
            exit 1
          fi
          if npm view "@coszone/koharu-astro@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@coszone/koharu-astro@$VERSION already exists and cannot be overwritten." >&2
            exit 1
          fi

      - name: Stage through npm trusted publishing
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          TARBALL: .artifacts/koharu-astro/package.tgz
        run: npm --loglevel=verbose stage publish "$TARBALL" --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/
